# nixpacks.toml
# Place this file in the ROOT of your repo (same level as backend/ and frontend/)
# Railway reads this automatically — no railpack.json needed.

[phases.setup]
nixPkgs = ["python311", "pip"]

[phases.install]
cmds = ["pip install -r backend/requirements.txt"]

[start]
cmd = "cd backend && gunicorn flask_app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"