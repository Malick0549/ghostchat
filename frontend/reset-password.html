<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - GhostChat</title>
    <link id="theme-stylesheet" rel="stylesheet" href="themes/dark.theme.css">
    <link rel="stylesheet" href="css/ghostchat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="cyber-bg" aria-hidden="true"></div>
<div class="grid-overlay" aria-hidden="true"></div>

<div class="auth-page">
    <div class="auth-wrapper">
        <aside class="auth-brand" aria-hidden="true">
            <a href="index.html" class="brand-logo">
                <i class="fas fa-ghost"></i>
                <span>GhostChat</span>
            </a>
            <div class="brand-headline">
                <h2>Reset <span>Password</span></h2>
                <p>Create a new secure password for your account.</p>
            </div>
        </aside>

        <section class="auth-form-panel">
            <div class="auth-form-wrap">
                <h1 class="form-title">New Password</h1>
                <p class="form-subtitle">Enter your new password below</p>

                <div class="alert alert-error" id="alertErr" role="alert">
                    <i class="fas fa-triangle-exclamation"></i>
                    <span id="errMsg"></span>
                </div>
                <div class="alert alert-success" id="alertOk" role="status">
                    <i class="fas fa-check-circle"></i>
                    <span id="okMsg"></span>
                </div>

                <form id="resetForm">
                    <div class="form-group">
                        <label class="form-label" for="newPw">New Password</label>
                        <div class="input-wrap">
                            <i class="fas fa-lock icon"></i>
                            <input type="password" id="newPw" class="form-input" placeholder="At least 8 characters" required>
                        </div>
                        <div class="pw-strength">
                            <div class="pw-bar"><div class="pw-fill" id="pwFill"></div></div>
                            <span class="pw-label" id="pwLabel"></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="confirmPw">Confirm Password</label>
                        <div class="input-wrap">
                            <i class="fas fa-lock icon"></i>
                            <input type="password" id="confirmPw" class="form-input" placeholder="Confirm your new password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit" id="btnReset">
                        <i class="fas fa-shield-check"></i>
                        <span>RESET PASSWORD</span>
                    </button>
                </form>

                <p style="text-align:center;margin-top:20px;">
                    <a href="login.html" style="color:var(--primary);">Back to Sign In</a>
                </p>
            </div>
        </section>
    </div>
</div>

<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script>
(function() {
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    if (!token) {
        document.getElementById('alertErr').classList.add('show');
        document.getElementById('errMsg').textContent = 'Invalid reset link. Please request a new one.';
        document.getElementById('btnReset').disabled = true;
        return;
    }
    
    // Password strength meter
    document.getElementById('newPw').addEventListener('input', function() {
        const v = this.value;
        const fill = document.getElementById('pwFill');
        const label = document.getElementById('pwLabel');
        let score = 0;
        if (v.length >= 8) score++;
        if (/[A-Z]/.test(v)) score++;
        if (/[0-9]/.test(v)) score++;
        if (/[^A-Za-z0-9]/.test(v)) score++;
        const levels = ['', 'weak', 'fair', 'good', 'strong'];
        const labels = ['', 'Too weak', 'Fair', 'Good', 'Strong ✓'];
        fill.className = `pw-fill ${levels[score] || ''}`;
        label.textContent = v.length ? `Strength: ${labels[score] || 'Too weak'}` : '';
    });
    
    document.getElementById('resetForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const newPw = document.getElementById('newPw').value;
        const confirmPw = document.getElementById('confirmPw').value;
        
        if (newPw.length < 8) {
            document.getElementById('errMsg').textContent = 'Password must be at least 8 characters.';
            document.getElementById('alertErr').classList.add('show');
            return;
        }
        
        if (newPw !== confirmPw) {
            document.getElementById('errMsg').textContent = 'Passwords do not match.';
            document.getElementById('alertErr').classList.add('show');
            return;
        }
        
        const btn = document.getElementById('btnReset');
        btn.classList.add('btn-loading');
        btn.disabled = true;
        
        try {
            const response = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, new_password: newPw })
            });
            
            const data = await response.json();
            
            if (response.ok && data.success) {
                document.getElementById('alertOk').classList.add('show');
                document.getElementById('okMsg').textContent = 'Password reset successfully! Redirecting...';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                document.getElementById('alertErr').classList.add('show');
                document.getElementById('errMsg').textContent = data.error || 'Reset failed. Please request a new link.';
            }
        } catch (err) {
            document.getElementById('alertErr').classList.add('show');
            document.getElementById('errMsg').textContent = 'Network error. Please try again.';
        } finally {
            btn.classList.remove('btn-loading');
            btn.disabled = false;
        }
    });
})();
</script>
</body>
</html>
