# render.yaml
services:
  - type: web
    name: ghostchat
    runtime: python
    repo: https://github.com/YOUR_USERNAME/ghostchat
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && gunicorn flask_app:app
    envVars:
      - key: FLASK_SECRET
        generateValue: true
      - key: FLASK_DEBUG
        value: 0
      - key: PYTHON_VERSION
        value: 3.11.0